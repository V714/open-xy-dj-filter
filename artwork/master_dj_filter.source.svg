<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="222" viewBox="0 0 480 222" role="img" aria-labelledby="title desc" aria-label="DJ Filter room on a continuous stock-sized 5 by 5 floor grid">
  <title id="title">DJ Filter — shared 30 by 20 grid, neutral 50</title>
  <desc id="desc">A fixed opaque dark room floor aligns with the stock-sized 30 by 20 background grid. The floor spans 5 by 5 grid cells. Only the backdrop brightens above 50, also visible through open doors/windows.</desc>
  <defs>
    <pattern id="highpass-floor-tile-pattern" width="30" height="20" patternUnits="userSpaceOnUse" data-pattern="shared-room-and-background" data-sync="origin:240,110;steps:15,10;-15,10" x="240" y="110">
      <rect x="0" y="0" width="30" height="20" fill="#000000" id="highpass-background-tile-color" data-purpose="update-solid-fill-only-when-filter-is-above-50">
        </rect>
      <path id="highpass-background-grout" d="M -30 0 L 0 20 M -30 20 L 0 0 M 0 0 L 30 20 M 0 20 L 30 0 M 30 0 L 60 20 M 30 20 L 60 0" fill="none" stroke="#000000" stroke-width="0.5" stroke-linecap="butt" />
    </pattern>
    <polygon id="room-floor-reference" points="240,109 318,160 240,211 162,160" fill="none" />
    <polygon id="floor-grid-reference" points="240,110 315,160 240,210 165,160" data-tiles-per-edge="5" fill="none" />
  </defs>
  <rect id="background" width="480" height="222" fill="#000000" />
  <g id="highpass-background-tiles" data-layer="full-canvas-backdrop" data-filter-range="51-100" data-current-value="50" data-grayscale="#000000">
    <rect id="highpass-background-tile-surface" x="0" y="0" width="480" height="222" fill="url(#highpass-floor-tile-pattern)" />
  </g>
  <g id="room" stroke-linecap="round" stroke-linejoin="round" transform="matrix(0.9615384615 0 0 0.9803921569 9.2307692308 3.1372549020)">
    <g id="wall-fills" stroke="none">
      <path id="wall-left-fill" fill="#282828" d="M 162 73 L 240 22 L 240 109 L 162 160 Z M 186.73 84.17 L 215.27 65.36 L 215.27 125.2 L 186.73 143.8 Z" fill-rule="evenodd" />
      <path id="wall-right-fill" fill="#282828" d="M 240 22 L 318 73 L 318 160 L 240 109 Z M 269.02 70.9 L 290.79 85.18 L 290.79 120.09 L 269.02 105.82 Z" fill-rule="evenodd" />
    </g>
    <g id="floor-fill" stroke="none">
      <polygon id="floor-surface" points="162,160 240,109 318,160 240,211" fill="#0D0D0D" />
    </g>
    <g id="doorway">
      <path id="door-frame" d="M 186.73 143.8 L 186.73 84.17 L 215.27 65.36 L 215.27 125.2" fill="none" stroke="#B8B8B8" stroke-width="1.2" />
      <path id="door-inner-edge" d="M 189.11 142.25 L 189.11 85.37 L 212.89 69.45 L 212.89 126.75" fill="none" stroke="#7F7F7F" stroke-width="0.7" />
    </g>
    <g id="window">
      <path id="window-frame-outer" fill="#171717" stroke="#B8B8B8" stroke-width="1.2" d="M 266.3 66.71 L 293.51 84.36 L 293.51 124.6 L 266.3 107.09 Z M 269.02 70.9 L 290.79 85.18 L 290.79 120.09 L 269.02 105.82 Z" fill-rule="evenodd" />
      <g id="window-roller-blind" data-coverage="0" data-direction="top-down" data-state="retracted">
        <g id="window-blind-fabric" transform="matrix(1 0.656 0 1 269.02 70.90)" data-local-width="21.77" data-local-height="34.92">
          <g id="blind-rollout" transform="scale(1 0)" data-coverage="0">
            <rect id="blind-panel" x="0" y="0" width="21.77" height="34.92" fill="#7F7F7F" />
            <path id="window-blind-bottom-bar" d="M 0 34.92 H 21.77" fill="none" stroke="#DCDCDC" stroke-width="1.15" vector-effect="non-scaling-stroke" />
          </g>
        </g>
        <polygon id="window-blind-headrail" points="268.57,70.18 291.24,85 291.24,87.33 268.57,72.52" fill="#5C5C5C" stroke="#C9C9C9" stroke-width="0.7" />
      </g>
      <polygon id="window-inner-outline" points="269.02,70.9 290.79,85.18 290.79,120.09 269.02,105.82" fill="none" stroke="#7F7F7F" stroke-width="0.8" />
    </g>
    <g id="walls" fill="none" stroke="#7F7F7F" stroke-width="1.05">
      <path id="wall-top-left" d="M 162 73 L 240 22" />
      <path id="wall-top-right" d="M 240 22 L 318 73" />
      <path id="wall-left-edge" d="M 162 73 L 162 160" />
      <path id="wall-back-corner" d="M 240 22 L 240 109" />
      <path id="wall-right-edge" d="M 318 73 L 318 160" />
    </g>
    <g id="floor" fill="none" stroke="#7F7F7F" stroke-width="1.05">
      <path id="floor-back-left" d="M 162 160 L 240 109" />
      <path id="floor-back-right" d="M 240 109 L 318 160" />
      <path id="floor-front-left" d="M 162 160 L 240 211" />
      <path id="floor-front-right" d="M 240 211 L 318 160" />
    </g>
    <g id="door" data-state="open" data-hinge="right" data-angle-deg="90" data-default-value="50">
      <g id="door-hinge-pivot" transform="translate(215.27 65.36)">
        <g id="door-swing" transform="scale(1 1)" data-control="x-projection -1 to 1">
          <g id="door-iso-projection" transform="skewY(33.3878774)" data-control="skewY angle for foreshortening">
            <g id="door-leaf">
              <rect id="door-panel" x="0" y="0" width="28.54" height="59.84" fill="#282828" stroke="#C9C9C9" stroke-width="1.2" vector-effect="non-scaling-stroke" />
              <path id="door-panel-inset" d="M 2.38 4.8 L 26.16 4.8 L 26.16 55.04 L 2.38 55.04" fill="none" stroke="#5C5C5C" stroke-width="0.75" vector-effect="non-scaling-stroke" />
              <g id="door-handle" stroke="#DCDCDC" stroke-width="1" fill="#171717">
                <circle id="handle-outer" cx="24.35" cy="29.92" r="1.9" vector-effect="non-scaling-stroke" />
                <path id="handle-stem" d="M 24.35 29.92 L 20.5 29.92" fill="none" vector-effect="non-scaling-stroke" />
              </g>
            </g>
          </g>
        </g>
      </g>
      <g id="door-hinges" stroke="#C9C9C9" stroke-width="1">
        <path id="hinge-top" d="M 215.27 76.56 L 215.27 80.86" />
        <path id="hinge-bottom" d="M 215.27 111 L 215.27 115.3" />
      </g>
    </g>
  </g>
</svg>
